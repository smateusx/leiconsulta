server.port=8080
spring.application.name=leiconsulta-api

spring.datasource.url=jdbc:sqlite:data/leis.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

python.url=http://127.0.0.1:8002

# Senha compartilhada do gabinete. Troque antes de usar de verdade.
leiconsulta.senha=Cachoeira2026

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
